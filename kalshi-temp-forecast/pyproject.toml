[project]
name = "kalshi-temp-forecast"
version = "0.1.0"
description = "Forecast daily-high-temperature exceedance probabilities for Kalshi temperature markets (NWS Camp Mabry / KATT)."
requires-python = ">=3.11"
dependencies = ["pandas>=2.0", "requests>=2.28", "pyarrow>=12.0", "numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
