<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>The Look Book | Juniper Floral Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: 'Manrope', system-ui, sans-serif;
        background: #262220; color: #faf8f4;
        display: flex; flex-direction: column; overflow: hidden;
      }
      header {
        display: flex; align-items: center; justify-content: space-between;
        padding: 14px 22px; flex: 0 0 auto;
      }
      header a.brand { display: flex; align-items: center; gap: 12px; text-decoration: none; color: #faf8f4; }
      header img { height: 40px; filter: brightness(0) invert(1); opacity: .9; }
      header .title { font-family: 'Playfair Display', serif; font-size: 1.05rem; letter-spacing: .02em; }
      header .tools { display: flex; gap: 10px; }
      header .tools a, header .tools button {
        background: none; border: 1px solid rgba(250,248,244,.35); color: #faf8f4;
        border-radius: 999px; padding: 7px 16px; font-family: inherit; font-size: .72rem;
        letter-spacing: .16em; text-transform: uppercase; cursor: pointer; text-decoration: none;
        transition: border-color .2s, color .2s;
      }
      header .tools a:hover, header .tools button:hover { border-color: #c3a071; color: #c3a071; }

      #stage { flex: 1 1 auto; position: relative; display: flex; align-items: center; justify-content: center; padding: 8px 64px; min-height: 0; }
      #book { touch-action: pan-y; }
      #book .page { background: #f4f1ec; overflow: hidden; }
      #book .page img { width: 100%; height: 100%; object-fit: cover; display: block;
        user-select: none; -webkit-user-drag: none; }

      .nav-arrow {
        position: absolute; top: 50%; transform: translateY(-50%);
        background: none; border: none; color: rgba(250,248,244,.65); cursor: pointer;
        font-size: 2.4rem; line-height: 1; padding: 18px 14px; z-index: 5;
        transition: color .2s;
      }
      .nav-arrow:hover { color: #c3a071; }
      #prev { left: 8px; } #next { right: 8px; }

      footer {
        flex: 0 0 auto; display: flex; align-items: center; justify-content: center;
        gap: 18px; padding: 12px; font-size: .78rem; color: rgba(250,248,244,.65);
      }
      footer .pageno { letter-spacing: .12em; }
      footer a { color: rgba(250,248,244,.65); }
      footer a:hover { color: #c3a071; }

      #status {
        position: absolute; inset: 0; display: flex; flex-direction: column; gap: 18px;
        align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      #status h1 { font-family: 'Playfair Display', serif; font-weight: 500; font-size: 1.5rem; }
      #status p { color: rgba(250,248,244,.7); line-height: 1.7; max-width: 30rem; }
      #status a { color: #c3a071; }
      .spin { width: 26px; height: 26px; border: 2px solid rgba(250,248,244,.2);
        border-top-color: #c3a071; border-radius: 50%; animation: sp .9s linear infinite; }
      @keyframes sp { to { transform: rotate(360deg); } }
      @media (max-width: 700px) {
        #stage { padding: 4px; }
        .nav-arrow { display: none; }
        header .tools a.dl { display: none; }
      }

      /* A phone held sideways has ~390px of height, and the header and footer
         were eating a third of it. On short screens they float over the book
         instead of pushing it, and fade away once you start reading. */
      body.compact header, body.compact footer {
        position: fixed; left: 0; right: 0; z-index: 20;
        background: linear-gradient(to bottom, rgba(38,34,32,.85), rgba(38,34,32,0));
        padding: 8px 14px; transition: opacity .35s;
      }
      body.compact header { top: 0; }
      body.compact footer {
        bottom: 0; background: linear-gradient(to top, rgba(38,34,32,.85), rgba(38,34,32,0));
      }
      body.compact header img { height: 28px; }
      body.compact #stage { padding: 0; }
      body.compact.reading header, body.compact.reading footer { opacity: 0; pointer-events: none; }

      #hint {
        position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%);
        background: rgba(38,34,32,.92); border: 1px solid rgba(250,248,244,.25);
        padding: 9px 16px; border-radius: 999px; font-size: .72rem; letter-spacing: .1em;
        text-transform: uppercase; z-index: 30; transition: opacity .5s; white-space: nowrap;
      }
      #hint.gone { opacity: 0; pointer-events: none; }

      /* Tap a page to read it close up — the printed book has type that a
         phone-sized spread simply can't render legibly. */
      #zoom {
        position: fixed; inset: 0; z-index: 40; background: #17150f;
        display: none; overflow: auto; -webkit-overflow-scrolling: touch;
        touch-action: pan-x pan-y pinch-zoom;
      }
      #zoom.on { display: block; }
      #zoom img { display: block; width: 180%; max-width: none; margin: 0 auto; }
      @media (min-width: 700px) { #zoom img { width: 100%; max-width: 900px; } }
      #zoomClose {
        position: fixed; top: 12px; right: 12px; z-index: 41;
        background: rgba(38,34,32,.9); border: 1px solid rgba(250,248,244,.35);
        color: #faf8f4; border-radius: 999px; width: 40px; height: 40px;
        font-size: 1.1rem; cursor: pointer; display: none;
      }
      #zoom.on ~ #zoomClose { display: block; }
    </style>
  </head>
  <body>
    <header>
      <a class="brand" href="/">
        <img src="/images/juniper-logo.png" alt="Juniper Floral Studio" />
        <span class="title">The Look Book</span>
      </a>
      <div class="tools">
        <a class="dl" href="/lookbook/juniper-look-book.pdf" download>Download</a>
        <button id="fs">Fullscreen</button>
      </div>
    </header>

    <div id="stage">
      <button class="nav-arrow" id="prev" aria-label="Previous page">‹</button>
      <div id="book"></div>
      <button class="nav-arrow" id="next" aria-label="Next page">›</button>
      <div id="status"><div class="spin"></div></div>
    </div>

    <footer>
      <span class="pageno" id="pageno"></span>
      <a href="/inquire/">Start an enquiry</a>
    </footer>

    <div id="zoom"><img id="zoomImg" alt="" /></div>
    <button id="zoomClose" aria-label="Close">✕</button>

    <script src="/assets/vendor/page-flip.browser.js"></script>
    <script>
      (async function () {
        const BASE = '/lookbook/pages/';
        const status = document.getElementById('status');
        const fail = (msg) => { status.innerHTML = '<h1>Almost here</h1><p>' + msg + '</p>'; };

        // Pages are pre-rendered to WebP at build time (netlify/build-lookbook.mjs).
        // The browser fetches only the spreads someone actually opens, at the size
        // their screen can show — no PDF download, no client-side rasterising.
        const man = await fetch(BASE + 'pages.json').then((r) => r.ok ? r.json() : null).catch(() => null);
        if (!man) {
          return fail(
            'The look book is being prepared — your copy will arrive by email shortly. ' +
            'In the meantime, our <a href="/portfolio/">portfolio</a> has every wedding in full.'
          );
        }

        const stage = document.getElementById('stage');
        const bookEl = document.getElementById('book');
        const ratio = man.ratio;                       // width / height of a page
        const portrait = () => stage.clientWidth < 700;

        let pageW = 0, across = 2;
        const fit = () => {
          // Reclaim the chrome on short screens (a phone turned sideways) —
          // otherwise the header and footer take a third of the height.
          document.body.classList.toggle('compact', window.innerHeight < 560);
          const pad = document.body.classList.contains('compact') ? 4 : 12;
          const fitH = stage.clientHeight - pad;
          across = portrait() ? 1 : 2;
          const fitW = (stage.clientWidth - 16) / across;
          const h = Math.min(fitH, fitW / ratio);
          pageW = Math.round(h * ratio);
          bookEl.style.width = (pageW * across) + 'px';
          bookEl.style.height = Math.round(h) + 'px';
        };
        fit();

        // Pick the variant that matches the display's real pixels, so the page is
        // sharp on a Retina screen without sending a phone a laptop-sized file.
        const dpr = window.devicePixelRatio || 1;
        const need = pageW * dpr;
        const width = man.widths.filter((w) => w >= need)[0] || man.widths[man.widths.length - 1];
        const ver = man.v ? '?v=' + man.v : '';
        const url = (n) => BASE + 'p' + String(n).padStart(3, '0') + '@' + width + '.webp' + ver;

        const shells = [];
        for (let i = 1; i <= man.count; i++) {
          const d = document.createElement('div');
          d.className = 'page';
          const im = document.createElement('img');
          im.alt = 'Page ' + i;
          d.appendChild(im);
          bookEl.appendChild(d);
          shells.push(im);
        }

        // Only load what's near the reader; widen the window as they move, so a
        // browse of six pages costs six pages of bandwidth, not fifty-three.
        const AHEAD = 5, BEHIND = 2;
        function loadAround(i) {
          for (let n = Math.max(1, i - BEHIND); n <= Math.min(man.count, i + AHEAD); n++) {
            const im = shells[n - 1];
            if (!im.src) im.src = url(n);
          }
        }

        // Nothing competes with the cover for bandwidth: fetch it alone, show
        // the book, and only then start pulling the pages behind it.
        shells[0].src = url(1);
        await new Promise((res) => {
          if (shells[0].complete) return res();
          shells[0].onload = shells[0].onerror = res;
          setTimeout(res, 4000);
        });
        status.remove();
        loadAround(1);

        const flip = new St.PageFlip(bookEl, {
          width: 1000, height: Math.round(1000 / ratio),
          size: 'stretch',
          minWidth: 150, maxWidth: 3000, minHeight: 200, maxHeight: 3000,
          showCover: true, maxShadowOpacity: 0.35, usePortrait: true,
          mobileScrollSupport: false,
        });
        flip.loadFromHTML(bookEl.querySelectorAll('.page'));
        window.addEventListener('resize', fit);

        const pageno = document.getElementById('pageno');
        const show = () => {
          const p = flip.getCurrentPageIndex() + 1;
          pageno.textContent = 'Page ' + p + ' of ' + man.count;
          loadAround(p);
        };
        show();
        flip.on('flip', show);

        document.getElementById('prev').onclick = () => flip.flipPrev();
        document.getElementById('next').onclick = () => flip.flipNext();
        document.addEventListener('keydown', (e) => {
          if (e.key === 'ArrowLeft') flip.flipPrev();
          if (e.key === 'ArrowRight') flip.flipNext();
          if (e.key === 'Escape') closeZoom();
        });

        // ---- read a page close up -------------------------------------------
        // Page-flip owns drag and pinch inside the book, so zooming happens in
        // its own layer rather than fighting those gestures.
        const zoom = document.getElementById('zoom');
        const zoomImg = document.getElementById('zoomImg');
        const big = (n) => BASE + 'p' + String(n).padStart(3, '0') + '@' + man.widths[man.widths.length - 1] + '.webp' + ver;
        function openZoom(n) {
          zoomImg.src = big(Math.min(man.count, Math.max(1, n)));
          zoom.classList.add('on');
          zoom.scrollTop = 0;
          zoom.scrollLeft = (zoom.scrollWidth - zoom.clientWidth) / 2;
        }
        function closeZoom() { zoom.classList.remove('on'); zoomImg.removeAttribute('src'); }
        document.getElementById('zoomClose').onclick = closeZoom;
        zoom.onclick = closeZoom;

        let lastTap = 0;
        bookEl.addEventListener('pointerup', (e) => {
          const now = Date.now();
          if (now - lastTap < 320) {
            const r = bookEl.getBoundingClientRect();
            const right = across === 2 && (e.clientX - r.left) > r.width / 2;
            openZoom(flip.getCurrentPageIndex() + 1 + (right ? 1 : 0));
            lastTap = 0;
          } else lastTap = now;
        });

        // ---- one-time nudges -------------------------------------------------
        const hint = document.createElement('div');
        hint.id = 'hint';
        // Touch, not width — a phone held sideways is 850px wide and would
        // otherwise be told to "double-click".
        const touch = window.matchMedia('(pointer: coarse)').matches;
        hint.textContent = !touch ? 'Double-click a page to read it close up'
          : across === 1 ? 'Turn your phone for the full spread · double-tap to zoom'
          : 'Double-tap a page to zoom';
        document.body.appendChild(hint);
        setTimeout(() => hint.classList.add('gone'), 5200);

        // On a short screen, let the chrome fade once reading starts, and bring
        // it back on a tap so the download and enquiry links stay reachable.
        let readT;
        const rest = () => {
          document.body.classList.remove('reading');
          clearTimeout(readT);
          readT = setTimeout(() => document.body.classList.add('reading'), 2600);
        };
        rest();
        ['pointerdown', 'keydown'].forEach((ev) => document.addEventListener(ev, rest));
        document.getElementById('fs').onclick = () => {
          if (document.fullscreenElement) document.exitFullscreen();
          else document.documentElement.requestFullscreen().catch(() => {});
        };
      })();
    </script>
  </body>
</html>
