<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Datum">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a5f92"/><stop offset="1" stop-color="#0f395c"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="44" height="44" rx="11" fill="url(#dg)"/>
  <!-- forecast trend rising from the datum point -->
  <polyline points="13,31 21,24 29,19 37,12" fill="none" stroke="#38bdf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="21" cy="24" r="1.7" fill="#38bdf8"/><circle cx="29" cy="19" r="1.7" fill="#38bdf8"/><circle cx="37" cy="12" r="2" fill="#38bdf8"/>
  <!-- datum baseline -->
  <line x1="10" y1="34" x2="38" y2="34" stroke="#9bd0f5" stroke-width="2.4" stroke-linecap="round"/>
  <!-- reference point / target sitting on the baseline -->
  <circle cx="13" cy="34" r="4.6" fill="#0f395c" stroke="#e8f4ff" stroke-width="2.2"/>
  <circle cx="13" cy="34" r="1.5" fill="#e8f4ff"/>
</svg>
